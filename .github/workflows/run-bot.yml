name: Run OTT Ranking Bot

on:
  schedule:
    # 한국 시간 매일 오전 8시 = UTC 23시
    - cron: '0 23 * * *'
  
  # GitHub 페이지에서 'Run workflow' 버튼으로 수동 실행 가능
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
# 🚨 바로 아랫줄 맨 끝에 cloudscraper 를 꼭! 추가해 주세요.
          pip install requests beautifulsoup4 cloudscraper
      - name: Run script
        env:
          # Settings > Secrets and variables > Actions에 등록된 변수 사용
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python main.py
